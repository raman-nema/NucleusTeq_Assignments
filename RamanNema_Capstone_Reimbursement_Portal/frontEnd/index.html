<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReimburseHub — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">

  <!-- ── LOGIN CARD ── -->
  <div class="login-container">

    <div class="login-header">
      <div class="login-logo">Reimburse<span>Hub</span></div>
      <p class="login-subtitle">Sign in to your account</p>
    </div>

    <!-- Error / Success messages -->
    <div class="alert alert-error" id="loginError" style="display:none"></div>

    <form id="loginForm" autocomplete="off">

      <div class="form-group">
        <label for="loginEmail">Work Email</label>
        <input
          class="form-input"
          type="email"
          id="loginEmail"
          placeholder="name@company.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input
          class="form-input"
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        />
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">
        <span id="loginBtnLabel">Sign In</span>
        <span class="spinner" id="loginSpinner"></span>
      </button>

    </form>


  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    /* ── Handle login form submission ── */
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errBox   = document.getElementById('loginError');

      // Hide any previous errors
      errBox.style.display = 'none';

      // Show loading state on button
      setLoginLoading(true);

      try {
        // Attempt to fetch the current user using Basic Auth
        const user = await loginUser(email, password);

        // Save credentials and user info to localStorage
        saveSession(email, password, user);

        // Redirect based on role
        redirectByRole(user.role);

      } catch (err) {
        errBox.textContent  = err.message || 'Invalid email or password. Please try again.';
        errBox.style.display = 'block';
      } finally {
        setLoginLoading(false);
      }
    });

    function setLoginLoading(on) {
      document.getElementById('loginBtn').disabled         = on;
      document.getElementById('loginSpinner').style.display = on ? 'inline-block' : 'none';
    }
  </script>
</body>
</html>
