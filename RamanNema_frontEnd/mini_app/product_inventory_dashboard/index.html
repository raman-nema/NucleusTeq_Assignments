<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Inventory Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

</head>

<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>Loading products...</p>
    </div>

    <header>
        <h1>Product Inventory Dashboard</h1>
    </header>
    <div class="container">

        <!-- summary section -->
        <div class="summarySection">
            <div class="summaryBox">
                <p class="boxLabel">Total Products</p>
                <p class="boxNumber" id="totalProducts">0</p>
            </div>
            <div class="summaryBox">
                <p class="boxLabel">Total Value</p>
                <p class="boxNumber" id="totalValue">Rs. 0</p>
            </div>
            <div class="summaryBox">
                <p class="boxLabel">Out of Stock</p>
                <p class="boxNumber" id="outOfStock">0</p>
            </div>
        </div>

        <!-- filter and search bar -->
        <div class="filterBar">
            <input type="text" id="searchBox" placeholder="Search by name..." />

            <select id="categoryDropdown">
                <option value="all">All Categories</option>
            </select>

            <select id="sortDropdown">
                <option value="">Default</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="az">Name: A to Z</option>
                <option value="za">Name: Z to A</option>
            </select>

            <label class="checkboxLabel">
                <input type="checkbox" id="lowStockOnly" />
                Low Stock Only
            </label>
        </div>
        <!-- products show up here -->
        <div id="productList"></div>
        <p id="noProductsMsg" style="display:none;">No products found.</p>
        <div id="paginationBar"></div>

        <!-- form to add new product -->
        <div class="addProductForm">
            <h2>Add New Product</h2>
            <div class="inputGrid">
                <div class="inputField">
                    <label>Product Name</label>
                    <input type="text" id="newName" placeholder="e.g. Keyboard" />
                    <span class="errorMsg" id="nameError"></span>
                </div>
                <div class="inputField">
                    <label>Price</label>
                    <input type="number" id="newPrice" placeholder="e.g. 999" />
                    <span class="errorMsg" id="priceError"></span>
                </div>
                <div class="inputField">
                    <label>Stock</label>
                    <input type="number" id="newStock" placeholder="e.g. 20" />
                    <span class="errorMsg" id="stockError"></span>
                </div>
                <div class="inputField">
                    <label>Category</label>
                    <select id="newCategory">
                        <option value="">Select</option>
                        <option value="electronics">Electronics</option>
                        <option value="clothing">Clothing</option>
                        <option value="books">Books</option>
                        <option value="accessories">Accessories</option>
                    </select>
                    <span class="errorMsg" id="categoryError"></span>
                </div>
            </div>
            <button id="addProductBtn">Add Product</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
